<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charmly Icons Catalog</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--text:#1d2330;--muted:#6b7385;--border:#e2e5ec;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--text:#e6e9f0;--muted:#8a93a6;--border:#2a3040;--accent:#818cf8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px}
h1{font-size:20px;margin:0 0 10px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
.count{color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--card)}
nav a{white-space:nowrap;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text);text-decoration:none}
nav a:hover{border-color:var(--accent);color:var(--accent)}
main{padding:20px}
body.has-basket main{padding-bottom:150px}
section{margin-bottom:34px;scroll-margin-top:150px}
section h2{font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
section h2 span{font-size:12px;color:var(--muted);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 8px 10px;text-align:center;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card img,.card .ph{width:40px;height:40px;margin:0 auto 8px;display:block;object-fit:contain}
.card .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;border:1px dashed var(--border);border-radius:8px}
.card code{font-size:12px;word-break:break-all;direction:ltr;display:block;font-family:ui-monospace,Menlo,Consolas,monospace}
.add{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;line-height:1;cursor:pointer;padding:0}
.card.sel .add{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none!important}
#basket{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:none;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
#basket.show{display:flex}
#basket .info{font-size:14px;color:var(--muted)}
#basket code{flex:1;min-width:200px;direction:ltr;font-size:13px;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
button.ghost{background:transparent;color:var(--accent)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:40px 0;display:none}
</style>
</head>
<body>
<header>
  <h1>Charmly Icons Catalog <span class="count" id="total"></span></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Search by icon id, e.g. react, aws, docker..." autocomplete="off">
    <span class="count" id="shown"></span>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="content"></div>
  <div class="empty" id="empty">No icons match your search.</div>
</main>

<div id="basket">
  <span class="info"><b id="selCount">0</b> selected</span>
  <code id="url"></code>
  <button id="copyUrl">Copy URL</button>
  <button id="copyIds" class="ghost">Copy IDs</button>
  <button id="clear" class="ghost">Clear</button>
</div>
<div class="toast" id="toast"></div>

const $ = id => document.getElementById(id);
const selected = new Set();
const cards = [];

function iconUrl(id){ return `${BASE}?i=${encodeURIComponent(id)}&perline=1`; }

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1400);
}

async function copyText(text, msg){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove();
  }
  toast(msg);
}

function buildUrl(){
  const ids = [...selected];
  return ids.length ? `${BASE}?i=${ids.map(encodeURIComponent).join(",")}&perline=1` : "";
}

function refreshBasket(){
  const n = selected.size;
  $("selCount").textContent = n;
  $("url").textContent = buildUrl();
  $("basket").classList.toggle("show", n > 0);
  document.body.classList.toggle("has-basket", n > 0);
}

function toggleSelect(id, card){
  if(selected.has(id)){ selected.delete(id); card.classList.remove("sel"); }
  else { selected.add(id); card.classList.add("sel"); }
  refreshBasket();
}

function render(){
  const content = $("content"), nav = $("nav");
  let total = 0;
  DATA.forEach((cat, idx) => {
    const ids = cat.s.split(/\s+/).filter(Boolean);
    total += ids.length;

    const a = document.createElement("a");
    a.href = `#cat-${idx}`; a.textContent = cat.t;
    nav.appendChild(a);

    const sec = document.createElement("section");
    sec.id = `cat-${idx}`;
    sec.dataset.cat = cat.t;
    sec.innerHTML = `<h2>${cat.t} <span>${ids.length}</span></h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";

    ids.forEach(id => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.id = id.toLowerCase();
      card.title = "Click to copy the id";
      card.innerHTML = `
        <button class="add" title="Add to selection">+</button>
        <img src="${iconUrl(id)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>no preview</div>'">
        <code>${id}</code>`;
      card.addEventListener("click", e => {
        if(e.target.classList.contains("add")){ e.stopPropagation(); toggleSelect(id, card); return; }
        copyText(id, `Copied: ${id}`);
      });
      if(selected.has(id)) card.classList.add("sel");
      grid.appendChild(card);
      cards.push({card, sec, catEl: sec, id: id.toLowerCase()});
    });

    sec.appendChild(grid);
    content.appendChild(sec);
  });
  $("total").textContent = `(${total} icons)`;
}

function filter(){
  const q = $("q").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section").forEach(sec => {
    let count = 0;
    sec.querySelectorAll(".card").forEach(c => {
      const match = !q || c.dataset.id.includes(q);
      c.classList.toggle("hidden", !match);
      if(match) count++;
    });
    sec.classList.toggle("hidden", count === 0);
    shown += count;
  });
  $("shown").textContent = q ? `${shown} match(es)` : "";
  $("empty").style.display = shown === 0 ? "block" : "none";
}

$("q").addEventListener("input", filter);
$("copyUrl").addEventListener("click", () => copyText(buildUrl(), "URL copied"));
$("copyIds").addEventListener("click", () => copyText([...selected].join(","), "IDs copied"));
$("clear").addEventListener("click", () => {
  selected.clear();
  document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
  refreshBasket();
});

render();
refreshBasket();
</script>
